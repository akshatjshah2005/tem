name: Verify application builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-invitations
    env:
      DATABASE_URL: postgresql://invitations:invitations_dev@localhost:5432/digital_invitations
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-in-production
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: digital-invitations/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build API
        run: npm run build:api

      - name: Build frontend
        run: npm run build:web
