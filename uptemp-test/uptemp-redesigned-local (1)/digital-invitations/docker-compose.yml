version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: invitations-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: invitations
      POSTGRES_PASSWORD: invitations_dev
      POSTGRES_DB: digital_invitations
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invitations -d digital_invitations']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: invitations-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
